name: letsfly_mobile
description: Let's Fly mobile client — Android/iOS port of the authoritative Windows client.
publish_to: none
version: 8.6.0+86
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  web_socket_channel: ^3.0.3
  audioplayers: ^6.4.0
  record: ^6.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/audio/uno/
    - assets/audio/domino/
    - assets/audio/farkle/
    - assets/audio/ninety_nine/
    - assets/audio/scopa/
    - assets/audio/snakes_and_ladders/
    - assets/audio/tennis/
    - assets/audio/tennis/arabic_umpire/
    - assets/audio/thief_hunt/
    - assets/locales/
    - assets/help/
